  <div data-role="header"><h1>隱私與材料處理說明</h1></div>
  <div role="main" class="ui-content">
    <p>本頁面說明非官方中文字地化版本的技術邊界，不替代實際部署者依法制定的隱私政策。</p>
    <p>上游 Web 服務接收使用者上傳的論證圖檔案，在請求過程中讀取並處理內容。當前上傳處理路徑不會主動把案件材料寫入資料庫，但伺服器、反向代理、託管平臺或運維工具仍可能產生訪問日誌。</p>
    <p>不得向未經安全評估的公開部署上傳真實案件卷宗、個人敏感資訊、商業秘密或受保密義務約束的材料。</p>
    <p>實際部署者應根據適用法律明確處理目的、儲存期限、訪問許可權、日誌策略、安全措施和資料主體權利。</p>
