  <div data-role="header"><h1>使用幫助</h1></div>
  <div role="main" class="ui-content">
    <p>Carneades 用於評估、計算和視覺化結構化論證圖及 Dung 抽象論證框架。</p>
    <dl>
      <dt><a href="/carneades/eval-help">結構化論證圖</a></dt>
      <dd>匯入論證圖，進行推理評估並匯出結果。</dd>
      <dt><a href="/carneades/dung-help">Dung 論證框架</a></dt>
      <dd>使用 grounded、complete、preferred 或 stable 語義計算擴充套件。</dd>
    </dl>
    <p><strong>重要：</strong>`in`、`out` 和 `undecided` 是形式模型狀態，不等同於司法事實認定。</p>
    <p>專案資料：<a href="https://github.com/2432antony-13/carneades-4-zh-cn">中文字地化倉庫</a>；
      <a href="https://github.com/carneades/carneades-4">官方上游倉庫</a>。</p>
