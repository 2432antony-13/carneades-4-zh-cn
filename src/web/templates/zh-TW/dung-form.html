<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="utf-8">
  <title>Carneades {{.Version}} Dung 框架計算</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="https://code.jquery.com/mobile/1.4.5/jquery.mobile-1.4.5.min.css">
  <script src="https://code.jquery.com/jquery-1.11.1.min.js"></script>
  <script src="https://code.jquery.com/mobile/1.4.5/jquery.mobile-1.4.5.min.js"></script>
<link rel="icon" type="image/svg+xml" href="/carneades/assets/tony.svg">
</head>
<body>

<div data-role="page" id="DungForm">
<nav aria-label="Language" style="padding:10px;text-align:center;background:#f7f3ec;display:flex;gap:10px;align-items:center;justify-content:center;flex-wrap:wrap">
<img src="/carneades/assets/tony.svg" alt="Tony 24" width="40" height="40"><a data-ajax="false" href="?lang=zh-CN" lang="zh-CN">简体中文</a> ·
<a data-ajax="false" href="?lang=zh-TW" lang="zh-TW">繁體中文</a> ·
<a data-ajax="false" href="?lang=en" lang="en">English</a></nav>
  <div data-role="header"><h1>計算 Dung 論證框架擴充套件</h1></div>
  <div role="main" class="ui-content">
    <p>上傳使用 TGF 表示的 Dung 抽象論證框架，選擇語義並輸出擴充套件。伺服器對超過20個論證的框架僅支援 grounded 語義。</p>
    <form action="/carneades/dung" enctype="multipart/form-data" target="_blank" data-ajax="false" method="post">
      <label for="datafile">TGF 檔案：</label>
      <input id="datafile" type="file" name="datafile" size="40">
      <fieldset data-role="controlgroup" data-type="horizontal">
        <legend>語義：</legend>
        <input name="semantics" id="grounded" value="grounded" checked="checked" type="radio"><label for="grounded">Grounded</label>
        <input name="semantics" id="complete" value="complete" type="radio"><label for="complete">Complete</label>
        <input name="semantics" id="preferred" value="preferred" type="radio"><label for="preferred">Preferred</label>
        <input name="semantics" id="stable" value="stable" type="radio"><label for="stable">Stable</label>
      </fieldset>
      <fieldset data-role="controlgroup" data-type="horizontal">
        <legend>輸出格式：</legend>
        <input name="output-format" id="dot" value="dot" type="radio"><label for="dot">DOT</label>
        <input name="output-format" id="graphml" value="graphml" type="radio"><label for="graphml">GraphML</label>
        <input name="output-format" id="png" value="png" type="radio"><label for="png">PNG</label>
        <input name="output-format" id="svg" value="svg" type="radio"><label for="svg">SVG</label>
        <input name="output-format" id="text" value="text" checked="checked" type="radio"><label for="text">文字</label>
      </fieldset>
      <button class="ui-shadow ui-btn ui-corner-all" type="submit" id="submit-eval">開始計算</button>
    </form>
  </div>
  <div data-role="footer" data-id="main-footer" data-position="fixed">
    <div data-role="navbar"><ul>
      <li><a href="/carneades/" data-icon="home">首頁</a></li>
      <li><a href="/carneades/dung-help" data-icon="info">幫助</a></li>
      <li><a href="/carneades/dataprot" data-icon="info">隱私</a></li>
      <li><a href="/carneades/imprint" data-icon="info">宣告</a></li>
    </ul></div>
  </div>
</div>
</body>
</html>
