    <p>本页面说明非官方中文本地化版本的技术边界，不替代实际部署者依法制定的隐私政策。</p>
    <p>上游 Web 服务接收用户上传的论证图文件，在请求过程中读取并处理内容。当前上传处理路径不会主动把案件材料写入数据库，但服务器、反向代理、托管平台或运维工具仍可能产生访问日志。</p>
    <p>不得向未经安全评估的公开部署上传真实案件卷宗、个人敏感信息、商业秘密或受保密义务约束的材料。</p>
    <p>实际部署者应根据适用法律明确处理目的、保存期限、访问权限、日志策略、安全措施和数据主体权利。</p>
