<div data-role="page" id="HelpPage">
  <div data-role="header"><h1>使用帮助</h1></div>
  <div role="main" class="ui-content">
    <p>Carneades 用于评估、计算和可视化结构化论证图及 Dung 抽象论证框架。</p>
    <dl>
      <dt><a href="/carneades/eval-help">结构化论证图</a></dt>
      <dd>导入论证图，进行推理评估并导出结果。</dd>
      <dt><a href="/carneades/dung-help">Dung 论证框架</a></dt>
      <dd>使用 grounded、complete、preferred 或 stable 语义计算扩展。</dd>
    </dl>
    <p><strong>重要：</strong>`in`、`out` 和 `undecided` 是形式模型状态，不等同于司法事实认定。</p>
    <p>项目资料：<a href="https://github.com/2432antony-13/carneades-4-zh-cn">中文本地化仓库</a>；
      <a href="https://github.com/carneades/carneades-4">官方上游仓库</a>。</p>
  </div>
