<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <title>Carneades {{.Version}} 论证图评估</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="https://code.jquery.com/mobile/1.4.5/jquery.mobile-1.4.5.min.css">
  <script src="https://code.jquery.com/jquery-1.11.1.min.js"></script>
  <script src="https://code.jquery.com/mobile/1.4.5/jquery.mobile-1.4.5.min.js"></script>
</head>
<body>
<div data-role="page" id="EvalForm">
  <div data-role="header"><h1>评估证据论证图</h1></div>
  <div role="main" class="ui-content">
    <p>上传已经完成来源绑定和事实核验的结构化论证图。系统只计算图中明示的前提、攻击、争点和形式标准，不会判断上传材料是否真实。</p>
    <p><strong>事实门：</strong>模型抽取的候选事实、当事人主张和未知事实不得放入 <code>assumptions</code>。只有经人工核验并留有来源定位的教学输入才能暂时进入计算。</p>
    <p>初次使用建议选择
      <a href="https://github.com/2432antony-13/carneades-4-zh-cn/tree/master/examples/AGs/YAML">YAML 示例</a>。
      中国证据推理研究示例位于 <code>examples/AGs/YAML/zh-CN</code>。详细说明见
      <a href="/carneades/eval-help">帮助页</a>。</p>
    <form action="/carneades/eval" enctype="multipart/form-data" target="_blank" data-ajax="false" method="post">
      <label for="datafile">论证图文件：</label>
      <input id="datafile" type="file" name="datafile" size="40">
      <fieldset data-role="controlgroup" data-type="horizontal">
        <legend>输入格式：</legend>
        <input name="input-format" id="agxml" value="agxml" type="radio"><label for="agxml">AGXML</label>
        <input name="input-format" id="aif" value="aif" type="radio"><label for="aif">AIF</label>
        <input name="input-format" id="caf" value="caf" type="radio"><label for="caf">CAF</label>
        <input name="input-format" id="lkif" value="lkif" type="radio"><label for="lkif">LKIF</label>
        <input name="input-format" id="yamli" value="yaml" checked="checked" type="radio"><label for="yamli">YAML</label>
      </fieldset>
      <fieldset data-role="controlgroup" data-type="horizontal">
        <legend>输出格式：</legend>
        <input name="output-format" id="dot" value="dot" type="radio"><label for="dot">DOT</label>
        <input name="output-format" id="graphml" value="graphml" type="radio"><label for="graphml">GraphML</label>
        <input name="output-format" id="png" value="png" type="radio"><label for="png">PNG</label>
        <input name="output-format" id="svg" value="svg" checked="checked" type="radio"><label for="svg">SVG</label>
        <input name="output-format" id="yamlo" value="yaml" type="radio"><label for="yamlo">YAML</label>
      </fieldset>
      <button class="ui-shadow ui-btn ui-corner-all" type="submit" id="submit-eval">运行形式评估</button>
    </form>
  </div>
  <div data-role="footer" data-id="main-footer" data-position="fixed">
    <div data-role="navbar"><ul>
      <li><a href="/carneades/" data-icon="home">首页</a></li>
      <li><a href="/carneades/eval-help" data-icon="info">帮助</a></li>
      <li><a href="/carneades/dataprot" data-icon="info">隐私</a></li>
      <li><a href="/carneades/imprint" data-icon="info">声明</a></li>
    </ul></div>
  </div>
</div>
</body>
</html>
